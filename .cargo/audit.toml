# cargo-audit 0.22 has no `yanked` config key (schema: ignore,
# informational_warnings, severity_threshold only); yanked crates are denied
# by default in 0.22 (--no-yanked is the opt-out), so the historical
# `yanked = "deny"` line is dropped rather than ported.
