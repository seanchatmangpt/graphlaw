# P12 B1 mutation fleet — "specstate" family config.
#
# Companion to the committed .cargo/mutants.toml: identical shared keys
# (examine_globs, test_tool, additional_cargo members, timeout scaling,
# exclude_re below) with the killer suite narrowed to the spec/state courts.
# Targets the src/abi.rs spec/state parse surface: dialect_by_name,
# spec_dialect, spec_of, state_of, state_field.
#
# Consumed ONLY through scripts/mutation_court.sh:
#   MUTANTS_EXTRA="--config .cargo/mutants-court-specstate.toml" \
#     MUTANTS_OUTPUT=target-mutants/families/specstate \
#     scripts/mutation_court.sh --case 'dialect_by_name|spec_dialect|spec_of|state_of|state_field'
# Fleet driver: scripts/mutation_families.sh (preflight, escalation, verdict).

examine_globs = ["src/registry.rs", "src/abi.rs"]

test_tool = "cargo"

# The registry and dispatch are behind the `abi` feature.
additional_cargo_args = ["--features", "abi"]

# Family killer suite: the spec/state parse courts.
additional_cargo_test_args = [
  "--test", "law_state",
  "--test", "policy_admission",
]

# Rebuilding purrdf/purrdf-n3 after each family mutation is slow: scale the
# baseline test time generously and never go below a cold-relink floor.
timeout_multiplier = 6.0
minimum_test_timeout = 60.0

# Exact committed exclude_re from .cargo/mutants.toml (2026-10-24 working tree).
exclude_re = [
  "impl (std::fmt::)?(Debug|Display) for",
  "<impl (std::fmt::)?(Debug|Display) for",
  "fmt::Formatter",
  "replace <impl Debug",
  "replace <impl Display",
  "\\bfmt\\b.*-> (std::fmt::)?Result",
  "\\b(log|trace|debug|eprintln|println|tracing)\\b",
]
