# P12 B1 mutation fleet — "catchall" family config.
#
# Companion to the committed .cargo/mutants.toml: identical shared keys
# (examine_globs, test_tool, additional_cargo_args, timeout scaling,
# exclude_re) with the FULL committed killer suite (the committed 8 + the
# abi_response_builders_court killer, i.e. the working-tree killer list).
# The catchall family runs with NO --case filter: it sweeps the entire fleet
# universe and doubles as the fleet's reference run for the kill-set-equality
# falsifier (fleet merged verdicts must equal the catchall verdict per mutant).
#
# Consumed ONLY through scripts/mutation_court.sh:
#   MUTANTS_EXTRA="--config .cargo/mutants-court-catchall.toml" \
#     MUTANTS_OUTPUT=target-mutants/families/catchall \
#     scripts/mutation_court.sh
# Fleet driver: scripts/mutation_families.sh (preflight, escalation, verdict).

examine_globs = ["src/registry.rs", "src/abi.rs"]

test_tool = "cargo"

# The registry and dispatch are behind the `abi` feature.
additional_cargo_args = ["--features", "abi"]

# Family killer suite: the full committed 8 + builders list.
additional_cargo_test_args = [
  "--test", "registry_dispatch",
  "--test", "capabilities_digest",
  "--test", "registry_artifacts",
  "--test", "refusal_details",
  "--test", "resource_limits",
  "--test", "policy_admission",
  "--test", "knowledge_hooks",
  "--test", "law_state",
  # SQLRDF-28 killer: pins the exact bytes of limit_response /
  # missing_buffer_response / unknown_buffer_response and the spec_of
  # string-arm + guard paths (docs/jira/v26.10.22/SQLRDF-28.md).
  "--test", "abi_response_builders_court",
]

# Rebuilding purrdf/purrdf-n3 after each family mutation is slow: scale the
# baseline test time generously and never go below a cold-relink floor.
timeout_multiplier = 6.0
minimum_test_timeout = 60.0

# Exact committed exclude_re from .cargo/mutants.toml (2026-10-24 working tree).
exclude_re = [
  "impl (std::fmt::)?(Debug|Display) for",
  "<impl (std::fmt::)?(Debug|Display) for",
  "fmt::Formatter",
  "replace <impl Debug",
  "replace <impl Display",
  "\\bfmt\\b.*-> (std::fmt::)?Result",
  "\\b(log|trace|debug|eprintln|println|tracing)\\b",
]
