# P12 B1 mutation fleet — "builders" family config.
#
# Companion to the committed .cargo/mutants.toml: identical shared keys
# (examine_globs, test_tool, additional_cargo_args, timeout_multiplier,
# minimum_test_timeout, exclude_re below) with the killer suite narrowed to
# abi_response_builders_court ONLY. That court pins the exact bytes of
# limit_response / missing_buffer_response / unknown_buffer_response and the
# spec_of string-arm + guard paths (docs/jira/v26.10.22/SQLRDF-28.md).
#
# Consumed ONLY through scripts/mutation_court.sh:
#   MUTANTS_EXTRA="--config .cargo/mutants-court-builders.toml" \
#     MUTANTS_OUTPUT=target-mutants/families/builders \
#     scripts/mutation_court.sh --case 'limit_response|missing_buffer_response|unknown_buffer_response'
# Fleet driver: scripts/mutation_families.sh (preflight, escalation, verdict).

examine_globs = ["src/registry.rs", "src/abi.rs"]

test_tool = "cargo"

# The registry and dispatch are behind the `abi` feature.
additional_cargo_args = ["--features", "abi"]

# Family killer suite: the builders bytes court alone.
additional_cargo_test_args = [
  "--test", "abi_response_builders_court",
]

# Rebuilding purrdf/purrdf-n3 after each mutation is slow: scale the baseline
# test time generously and never go below a floor that covers a cold relink.
timeout_multiplier = 6.0
minimum_test_timeout = 60.0

# Exact committed exclude_re from .cargo/mutants.toml (2026-10-24 working tree).
exclude_re = [
  "impl (std::fmt::)?(Debug|Display) for",
  "<impl (std::fmt::)?(Debug|Display) for",
  "fmt::Formatter",
  "replace <impl Debug",
  "replace <impl Display",
  "\\bfmt\\b.*-> (std::fmt::)?Result",
  "\\b(log|trace|debug|eprintln|println|tracing)\\b",
]
