name: 'Stage WASI SDK + DuckDB wasm archives'
description:
  >-
  One staged-recipe composite shared by ci.yml (native, wasm-court,
  external-oracle), js.yml (js-build, js-drift) and release.yml: installs
  wasi-sdk 34 at /opt/wasi-sdk (fail-closed admission: bin/clang +
  share/cmake/wasi-sdk-p1.cmake must exist), restores the cached DuckDB
  wasm32-wasip1 static archive, or compiles the pinned DuckDB source
  (b6013f7a) with the witnessed uniform new-EH flag set, gates the archive's
  EH flavor by opcode BEFORE any cache admission (sum try_table > 0 across
  ALL members, legacy try == 0 on EVERY member, else exit 1 without
  copying), and exports WASI_SDK_PATH for later steps. Do not add
  -lwasi-emulated-* link flags: frozen-duckdb-sys wasi_posix.c already stubs
  those symbols. The shim header (wasi_compat34.h) and the archive-magic
  helper (archive_is_wasm32.py) are committed sibling files: heredocs are
  unusable inside this run block (a column-0 heredoc terminator would end
  the YAML literal block and an indented one never terminates in bash —
  both defects were live in the b8d92dd form, witnessed 2026-10-24), so
  in-script heredocs are banned here.

runs:
  using: composite
  steps:
    - name: Restore staged WASI SDK + duckdb wasm archives
      uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
      with:
        path: ~/.frozen-duckdb/cache/v2.0.0-dev-wasm32-wasip1
        # hashFiles is workspace-relative, so the key is identical across every
        # calling workflow and changes whenever this recipe changes — including
        # the committed shim header and magic helper (an edit to ANY of the
        # three files rotates the key: one-time cold DuckDB rebuild next CI).
        # NO restore-keys: a stale EH-flavor archive must never be silently
        # restored; admission is exact-key only.
        key: wasi-duckdb-v2.0.0-dev-b6013f7a-sdk34-wasm32-wasip1-${{ hashFiles('.github/actions/wasi-duckdb/action.yml', '.github/actions/wasi-duckdb/wasi_compat34.h', '.github/actions/wasi-duckdb/archive_is_wasm32.py') }}

    - name: Stage WASI SDK + duckdb wasm archives (WASI_SDK_PATH)
      shell: bash
      run: |
        set -euo pipefail
        CACHE="$HOME/.frozen-duckdb/cache/v2.0.0-dev-wasm32-wasip1"
        ACTIONS_DIR="${GITHUB_ACTION_PATH:-$(pwd)}"
        # Fail-closed admission of a cached archive: it must be an ar archive
        # of wasm32 objects — exact port of frozen-duckdb-builder
        # archive_is_wasm32 (ar magic + \0asm wasm magic; REFUSES Mach-O/ELF
        # magics — a host archive or binary is the historical false-pass).
        # Committed sibling file, invoked in-process (heredocs are unusable
        # in a composite run block; see the action description).
        is_wasm32_ar() {
          python3 "$ACTIONS_DIR/archive_is_wasm32.py" "$1"
        }
        # WASI_SDK_PATH is a wasi-sdk root. Install it even when the DuckDB
        # archive is already cached; the cache directory is not a wasi-sdk.
        if [ ! -x /opt/wasi-sdk/bin/clang ] || [ ! -f /opt/wasi-sdk/share/cmake/wasi-sdk-p1.cmake ]; then
          curl -fsSL -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
        fi
        test -x /opt/wasi-sdk/bin/clang
        test -f /opt/wasi-sdk/share/cmake/wasi-sdk-p1.cmake
        if [ -f "$CACHE/libduckdb.a" ] && is_wasm32_ar "$CACHE/libduckdb.a"; then
          echo "cached duckdb wasm32 archive admitted: $CACHE/libduckdb.a"
        else
          rm -f "$CACHE/libduckdb.a"
          if ! command -v cmake >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y cmake
          fi
          # Compile the pinned DuckDB source to the wasm32-wasip1 static
          # archive (frozen-duckdb-builder compile_wasip1_static recipe).
          DUCKDB_PIN=b6013f7aa2f36caabb9466ce1791667ea8a280bb
          TMP="$(mktemp -d)"
          git clone --quiet https://github.com/duckdb/duckdb.git "$TMP/duckdb"
          git -C "$TMP/duckdb" checkout --quiet "$DUCKDB_PIN"
          # DuckDB root CMakeLists sets POSITION_INDEPENDENT_CODE ON, which
          # compiles wasm objects as -fPIC (env.__memory_base); patch before
          # configure (same patch the builder applies; refuse if absent).
          grep -q 'set(CMAKE_POSITION_INDEPENDENT_CODE ON)' "$TMP/duckdb/CMakeLists.txt"
          sed -i 's/set(CMAKE_POSITION_INDEPENDENT_CODE ON)/set(CMAKE_POSITION_INDEPENDENT_CODE OFF)/' "$TMP/duckdb/CMakeLists.txt"
          # wasi_compat34.h shim (committed sibling file): wasi-sdk 34 libc
          # lacks TIOCGWINSZ and a `struct winsize` compatible with what
          # DuckDB's terminal probing expects, and sched_getcpu has no WASI
          # definition. The -include flag forces it into every C++ TU (C TUs
          # get the emulated-OS defines via CFLAGS and never include it).
          CFLAGS="-D_WASI_EMULATED_MMAN -D_WASI_EMULATED_SIGNAL -D_WASI_EMULATED_PROCESS_CLOCKS -D_WASI_EMULATED_GETPID" \
          CXXFLAGS="-D_WASI_EMULATED_MMAN -D_WASI_EMULATED_SIGNAL -D_WASI_EMULATED_PROCESS_CLOCKS -D_WASI_EMULATED_GETPID -fwasm-exceptions -mllvm -wasm-use-legacy-eh=0 -include $ACTIONS_DIR/wasi_compat34.h" \
          cmake -S "$TMP/duckdb" -B "$TMP/duckdb/build-wasip1" \
            -DCMAKE_TOOLCHAIN_FILE=/opt/wasi-sdk/share/cmake/wasi-sdk-p1.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXTENSIONS="core_functions;icu" -DBUILD_SHELL=OFF \
            -DBUILD_UNITTESTS=OFF -DENABLE_EXTENSION_AUTOLOADING=OFF \
            -DENABLE_EXTENSION_AUTOINSTALL=OFF -DBUILD_HTTPFS=OFF \
            -DBUILD_JEMALLOC=OFF -DDISABLE_THREADS=ON
          cmake --build "$TMP/duckdb/build-wasip1" --target duckdb_static core_functions_extension icu_extension -j "$(nproc)" \
            || cmake --build "$TMP/duckdb/build-wasip1" --target duckdb core_functions_extension icu_extension -j "$(nproc)"
          mkdir -p "$CACHE"
          AR="$TMP/duckdb/build-wasip1/src/libduckdb_static.a"
          [ -f "$AR" ] || AR="$TMP/duckdb/build-wasip1/src/libduckdb.a"
          is_wasm32_ar "$AR" || { echo "REFUSED: built archive is not wasm32 ar" >&2; exit 1; }
          # EH-FLAVOR GATE (fail-closed, BEFORE cache admission): scan ALL
          # archive members — the aggregate must carry new-EH try_table
          # opcodes (sum across members > 0) and EVERY member must carry zero
          # legacy `try` opcodes (first-member-only was the weak form: a
          # legacy member hidden behind a new-EH first member is exactly the
          # witnessed uninitialized-element dtor trap the gate exists to
          # refuse). A cached bad archive would poison every later run. On
          # failure exit 1 WITHOUT copying into the cache. Personality-symbol
          # references are NOT a gate input: they are a false-positive
          # heuristic (witnessed: ub_duckdb_parser.cpp.obj references
          # __gxx_wasm_personality_v0 while carrying 701 try_table / 0 legacy try).
          OD=/opt/wasi-sdk/bin/llvm-objdump
          AR_TOOL=/opt/wasi-sdk/bin/llvm-ar
          test -x "$OD" || { echo "REFUSED: EH gate requires /opt/wasi-sdk/bin/llvm-objdump" >&2; exit 1; }
          test -x "$AR_TOOL" || { echo "REFUSED: EH gate requires /opt/wasi-sdk/bin/llvm-ar" >&2; exit 1; }
          echo "EH-gate disassembler: $("$OD" --version | head -1)"
          EHGATE="$(mktemp -d)"
          tt_total=0
          gate_failed=0
          members=0
          while IFS= read -r mem; do
            out="$EHGATE/$(basename "$mem")"
            "$AR_TOOL" p "$AR" "$mem" > "$out" || { echo "REFUSED: EH gate cannot extract member $mem" >&2; rm -rf "$EHGATE"; exit 1; }
            bytes="$(wc -c < "$out")"
            tt="$("$OD" -d "$out" | grep -c try_table || true)"
            # Word-boundary `try` match: works in both objdump renderings
            # (mnemonic-first `try ` and bytes-first `06 40 <ws> try`) and
            # never matches try_table (`try` followed by `_` is not a word
            # end). The previous format-anchored regex (`: try[[:space:]]`)
            # counted ZERO on the bytes-first rendering — the legacy==0 law
            # was unenforceable in that format (witnessed on the local
            # llvm-objdump 2026-10-24).
            legacy="$("$OD" -d "$out" | grep -cE '(^|[[:space:]])try([[:space:]]|$)' || true)"
            echo "EH-gate member $mem ($bytes bytes): try_table=$tt legacy=$legacy"
            tt_total=$((tt_total + tt))
            if [ "$legacy" != "0" ]; then gate_failed=1; fi
            members=$((members + 1))
          done < <("$AR_TOOL" t "$AR")
          rm -rf "$EHGATE"
          if [ "$members" -eq 0 ]; then
            echo "REFUSED: EH gate enumerated zero archive members (tooling failure is gate failure) — nothing copied to cache" >&2
            exit 1
          fi
          if [ "$tt_total" -le 0 ] || [ "$gate_failed" != "0" ]; then
            echo "REFUSED: libduckdb.a EH flavor suspect (members=$members sum_try_table=$tt_total legacy_nonzero_members=$gate_failed; expected sum try_table>0 across members AND legacy==0 on EVERY member) — nothing copied to cache" >&2
            exit 1
          fi
          echo "EH-gate admitted: members=$members sum_try_table=$tt_total legacy=0 on every member"
          cp "$AR" "$CACHE/libduckdb.a"
          # Extension archives staged alongside the core (copy_extension_archives).
          find "$TMP/duckdb/build-wasip1" -name 'lib*_extension.a' -exec cp -n {} "$CACHE/" \;
        fi
        echo "staged: $(ls "$CACHE")"

    - name: Export WASI_SDK_PATH
      shell: bash
      run: echo "WASI_SDK_PATH=/opt/wasi-sdk" >> "$GITHUB_ENV"
