name: Mutation court

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  mutation:
    name: native mutation court (registry + ABI dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Run the court
        env:
          CARGO_TARGET_DIR: target-mutants
        run: scripts/mutation_court.sh --check
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: warn
