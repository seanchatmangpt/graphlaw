name: Mutation court

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  # 360-minute timeout is DELIBERATE, not a copy-paste: mutation scoring runs
  # the full suite per mutant. Real runs finish well inside it; raise, don't
  # lower, if a wave ever trips it.
  # Local equivalent: bash scripts/mutation_court.sh (same script, no --check).
  mutation:
    name: mutation court (cargo-mutants over registry + ABI dispatch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Run mutation court (scripts/mutation_court.sh --check)
        env:
          CARGO_TARGET_DIR: target-mutants
        run: scripts/mutation_court.sh --check
      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: warn
