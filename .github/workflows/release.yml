name: Release

# Fully automatic. On every push to main, release whatever version Cargo.toml
# declares if that version is not released yet:
#   1. build and test the WASI module and the whole workspace,
#   2. tag vX.Y.Z and create the GitHub release with graphlaw.wasm, the capability
#      registry (capability-registry.json/.ttl) and op-examples.json, each with a .blake3,
#   3. publish: intentionally absent. crates.io publishing is local-only
#      (operator decision 2026-10-10): `cargo publish -p graphlaw-eyeron &&
#      cargo publish -p graphlaw` from a logged-in machine; CI never holds
#      registry credentials. (graphlaw depends on graphlaw-eyeron, so eyeron
#      is published first.)
# A run with nothing to release exits in seconds. All steps are idempotent.
# To release: merge a change that bumps the version. Nothing else is required.
# HOLD: while the repository variable RELEASE_HOLD is `true`, every step below
# is skipped (nothing is tagged or published). Release = delete/unset the
# variable, then re-run this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # NOT locally reproducible end to end: it tags/releases via GH_TOKEN and
  # queries crates.io index state. The build/test portion is reproducible
  # locally (cargo build + cargo test + cargo package, see CLAUDE.md ladder).
  # A green run with work=no is normal (nothing to release), not a skipped gate.
  release:
    name: release if unreleased (tag + GitHub release with blake3 sidecars)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_HOLD: ${{ vars.RELEASE_HOLD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.96.0
          targets: wasm32-wasip1
      # WASI setup (L113): same staged-SDK + duckdb wasm32-archive recipe as
      # ci.yml — the wasm link refuses to build without WASI_SDK_PATH and the
      # compiled duckdb archives. PATCH-ON-L109-LANDING: swap for frozen-duckdb
      # scripts/build_wasi_duckdb.sh when L109 lands.
      - name: Decide what is unreleased
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          meta=$(cargo metadata --no-deps --format-version 1)
          ver() { echo "$meta" | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='$1'))"; }
          on_registry() { # crate version
            local n=$1 v=$2 p
            if [ ${#n} -le 3 ]; then p="${#n}/$n"; else p="${n:0:2}/${n:2:2}/$n"; fi
            local idx; idx=$(curl -fsS "https://index.crates.io/$p" 2>/dev/null || true)
            if grep -q "\"vers\":\"$v\"" <<<"$idx"; then echo yes; else echo no; fi
          }
          g=$(ver graphlaw); e=$(ver graphlaw-eyeron)
          tags=$(git ls-remote --tags origin "refs/tags/v$g" || true)
          tag=$([ -n "$tags" ] && echo yes || echo no)
          ep=$(on_registry graphlaw-eyeron "$e")
          gp=$(on_registry graphlaw "$g")
          work=no
          if [ "${RELEASE_HOLD:-}" = true ]; then
            echo "RELEASE_HOLD is true: skipping tag and publish"
            tag=yes; ep=yes; gp=yes
          fi
          if [ "$tag" = no ] || [ "$ep" = no ] || [ "$gp" = no ]; then work=yes; fi
          {
            echo "graphlaw=$g"; echo "tag_exists=$tag"
            echo "eyeron_published=$ep"; echo "graphlaw_published=$gp"; echo "work=$work"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Restore staged WASI SDK + duckdb wasm archives
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: ~/.frozen-duckdb/cache/v2.0.0-dev-wasm32-wasip1
          key: wasi-duckdb-v2.0.0-dev-b6013f7a-${{ hashFiles('.github/workflows/release.yml') }}
      - name: Stage WASI SDK + duckdb wasm archives (WASI_SDK_PATH)
        if: steps.plan.outputs.work == 'yes'
        run: |
          set -euo pipefail
          CACHE="$HOME/.frozen-duckdb/cache/v2.0.0-dev-wasm32-wasip1"
          # Fail-closed admission of a cached archive: it must be an ar archive
          # of wasm32 objects — mirrors frozen-duckdb-builder archive_is_wasm32
          # (ar magic + \0asm wasm magic, and REFUSES Mach-O/ELF magics; a host
          # archive or binary is the historical false-pass).
          is_wasm32_ar() { # exact port of frozen-duckdb-builder archive_is_wasm32
            python3 - "$1" <<'PY'
          import sys
          b = open(sys.argv[1], "rb").read(64 * 1024 * 1024)
          ok = (b.startswith(b"!<arch>\n") and b"\0asm" in b
                and not any(m in b for m in (b"\xcf\xfa\xed\xfe", b"\xfe\xed\xfa\xcf", b"\xca\xfe\xba\xbe", b"\x7fELF")))
          sys.exit(0 if ok else 1)
          PY
          }
          # WASI_SDK_PATH is a wasi-sdk root. Install it even when the DuckDB
          # archive is already cached; the cache directory is not a wasi-sdk.
          if [ ! -x /opt/wasi-sdk/bin/clang ] || [ ! -f /opt/wasi-sdk/share/cmake/wasi-sdk-p1.cmake ]; then
            curl -fsSL -o /tmp/wasi-sdk.tar.gz \
              https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
            sudo mkdir -p /opt/wasi-sdk
            sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          fi
          test -x /opt/wasi-sdk/bin/clang
          test -f /opt/wasi-sdk/share/cmake/wasi-sdk-p1.cmake
          if [ -f "$CACHE/libduckdb.a" ] && is_wasm32_ar "$CACHE/libduckdb.a"; then
            echo "cached duckdb wasm32 archive admitted: $CACHE/libduckdb.a"
          else
            if ! command -v cmake >/dev/null; then
              sudo apt-get update
              sudo apt-get install -y cmake
            fi
            # 2. Compile the pinned DuckDB source to the wasm32-wasip1 static
            #    archive (frozen-duckdb-builder compile_wasip1_static recipe).
            DUCKDB_PIN=b6013f7aa2f36caabb9466ce1791667ea8a280bb
            TMP="$(mktemp -d)"
            git clone --quiet https://github.com/duckdb/duckdb.git "$TMP/duckdb"
            git -C "$TMP/duckdb" checkout --quiet "$DUCKDB_PIN"
            grep -q 'set(CMAKE_POSITION_INDEPENDENT_CODE ON)' "$TMP/duckdb/CMakeLists.txt" # PIC patch pre-check
            sed -i 's/set(CMAKE_POSITION_INDEPENDENT_CODE ON)/set(CMAKE_POSITION_INDEPENDENT_CODE OFF)/' "$TMP/duckdb/CMakeLists.txt"
            cmake -S "$TMP/duckdb" -B "$TMP/duckdb/build-wasip1" \
              -DCMAKE_TOOLCHAIN_FILE=/opt/wasi-sdk/share/cmake/wasi-sdk-p1.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF -DBUILD_EXTENSIONS= -DBUILD_SHELL=OFF \
              -DBUILD_UNITTESTS=OFF -DENABLE_EXTENSION_AUTOLOADING=OFF \
              -DENABLE_EXTENSION_AUTOINSTALL=OFF -DBUILD_HTTPFS=OFF \
              -DBUILD_JEMALLOC=OFF -DDISABLE_THREADS=ON
            cmake --build "$TMP/duckdb/build-wasip1" --target duckdb_static -j "$(nproc)" \
              || cmake --build "$TMP/duckdb/build-wasip1" --target duckdb -j "$(nproc)"
            mkdir -p "$CACHE"
            AR="$TMP/duckdb/build-wasip1/src/libduckdb_static.a"
            [ -f "$AR" ] || AR="$TMP/duckdb/build-wasip1/src/libduckdb.a"
            is_wasm32_ar "$AR" || { echo "REFUSED: built archive is not wasm32 ar" >&2; exit 1; }
            cp "$AR" "$CACHE/libduckdb.a"
            find "$TMP/duckdb/build-wasip1" -name 'lib*_extension.a' -exec cp -n {} "$CACHE/" \;
          fi
          echo "WASI_SDK_PATH=/opt/wasi-sdk" >> "$GITHUB_ENV"
          echo "staged: $(ls "$CACHE")"
      # Release assets carry .blake3 sidecars (b3sum format). The runner has
      # rust, so the canonical tool is `cargo install b3sum --locked`.
      - name: Install b3sum (cargo install b3sum --locked)
        run: cargo install b3sum --locked

      - name: Build and test (only when there is something to release)
        if: steps.plan.outputs.work == 'yes'
        run: |
          set -euo pipefail
          cargo build --locked -p graphlaw-wasm --target wasm32-wasip1 --profile wasm
          GRAPHLAW_WASM="$PWD/target/wasm32-wasip1/wasm/graphlaw_wasm.wasm" cargo test --locked --all-targets --all-features
          cargo package -p graphlaw-eyeron -p graphlaw

      - name: Tag and create the GitHub release
        if: steps.plan.outputs.tag_exists == 'no'
        run: |
          set -euo pipefail
          mkdir dist
          cp target/wasm32-wasip1/wasm/graphlaw_wasm.wasm dist/graphlaw.wasm
          for f in capability-registry.json capability-registry.ttl op-examples.json; do
            cp "registry/$f" "dist/$f"
          done
          (cd dist && for f in graphlaw.wasm capability-registry.json capability-registry.ttl op-examples.json; do b3sum "$f" > "$f.blake3"; done)
          gh release create "v${{ steps.plan.outputs.graphlaw }}" \
            dist/graphlaw.wasm dist/graphlaw.wasm.blake3 \
            dist/capability-registry.json dist/capability-registry.json.blake3 \
            dist/capability-registry.ttl dist/capability-registry.ttl.blake3 \
            dist/op-examples.json dist/op-examples.json.blake3 \
            --target "$(git rev-parse HEAD)" --generate-notes --title "graphlaw v${{ steps.plan.outputs.graphlaw }}"

      - name: Publish (refused in CI)
        if: steps.plan.outputs.eyeron_published == 'no' || steps.plan.outputs.graphlaw_published == 'no'
        run: |
          echo "Publishing is local-only: run 'cargo publish -p graphlaw-eyeron && cargo publish -p graphlaw' from a logged-in machine."
          echo "CI tags and ships release artifacts only. Skipping crates.io publish."
