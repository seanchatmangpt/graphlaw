name: Release

# Fully automatic. On every push to main, release whatever version Cargo.toml
# declares if that version is not released yet:
#   1. build and test the WASI module and the whole workspace,
#   2. tag vX.Y.Z and create the GitHub release with graphlaw.wasm, the capability
#      registry (capability-registry.json/.ttl) and op-examples.json, each with a .sha256,
#   3. publish: intentionally absent. crates.io publishing is local-only
#      (operator decision 2026-10-10): `cargo cicd publish run` from a logged-in
#      machine actuates `cargo publish`; CI never holds registry credentials.
# A run with nothing to release exits in seconds. All steps are idempotent.
# To release: merge a change that bumps the version. Nothing else is required.
# HOLD: while the repository variable RELEASE_HOLD is `true`, every step below
# is skipped (nothing is tagged or published). Release = delete/unset the
# variable, then re-run this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: release if unreleased
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_HOLD: ${{ vars.RELEASE_HOLD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
          targets: wasm32-wasip1

      - name: Decide what is unreleased
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          meta=$(cargo metadata --no-deps --format-version 1)
          ver() { echo "$meta" | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='$1'))"; }
          on_registry() { # crate version
            local n=$1 v=$2 p
            if [ ${#n} -le 3 ]; then p="${#n}/$n"; else p="${n:0:2}/${n:2:2}/$n"; fi
            local idx; idx=$(curl -fsS "https://index.crates.io/$p" 2>/dev/null || true)
            if grep -q "\"vers\":\"$v\"" <<<"$idx"; then echo yes; else echo no; fi
          }
          g=$(ver graphlaw); e=$(ver graphlaw-eyeron)
          tags=$(git ls-remote --tags origin "refs/tags/v$g" || true)
          tag=$([ -n "$tags" ] && echo yes || echo no)
          ep=$(on_registry graphlaw-eyeron "$e")
          gp=$(on_registry graphlaw "$g")
          work=no
          if [ "${RELEASE_HOLD:-}" = true ]; then
            echo "RELEASE_HOLD is true: skipping tag and publish"
            tag=yes; ep=yes; gp=yes
          fi
          if [ "$tag" = no ] || [ "$ep" = no ] || [ "$gp" = no ]; then work=yes; fi
          {
            echo "graphlaw=$g"; echo "tag_exists=$tag"
            echo "eyeron_published=$ep"; echo "graphlaw_published=$gp"; echo "work=$work"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Build and test (only when there is something to release)
        if: steps.plan.outputs.work == 'yes'
        run: |
          set -euo pipefail
          cargo build --locked -p graphlaw-wasm --target wasm32-wasip1 --profile wasm
          GRAPHLAW_WASM="$PWD/target/wasm32-wasip1/wasm/graphlaw_wasm.wasm" cargo test --locked --all-targets --all-features
          cargo package -p graphlaw-eyeron -p graphlaw

      - name: Tag and create the GitHub release
        if: steps.plan.outputs.tag_exists == 'no'
        run: |
          set -euo pipefail
          mkdir dist
          cp target/wasm32-wasip1/wasm/graphlaw_wasm.wasm dist/graphlaw.wasm
          for f in capability-registry.json capability-registry.ttl op-examples.json; do
            cp "registry/$f" "dist/$f"
          done
          (cd dist && for f in graphlaw.wasm capability-registry.json capability-registry.ttl op-examples.json; do sha256sum "$f" > "$f.sha256"; done)
          gh release create "v${{ steps.plan.outputs.graphlaw }}" \
            dist/graphlaw.wasm dist/graphlaw.wasm.sha256 \
            dist/capability-registry.json dist/capability-registry.json.sha256 \
            dist/capability-registry.ttl dist/capability-registry.ttl.sha256 \
            dist/op-examples.json dist/op-examples.json.sha256 \
            --target "$(git rev-parse HEAD)" --generate-notes --title "graphlaw v${{ steps.plan.outputs.graphlaw }}"

      - name: Publish (refused in CI)
        if: steps.plan.outputs.eyeron_published == 'no' || steps.plan.outputs.graphlaw_published == 'no'
        run: |
          echo "Publishing is local-only: run 'cargo cicd publish run' from a logged-in machine."
          echo "CI tags and ships release artifacts only. Skipping crates.io publish."
