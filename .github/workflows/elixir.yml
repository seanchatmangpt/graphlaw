name: graphlaw_ex-courts

on:
  push:
    branches: [main]
    paths:
      - 'graphlaw_ex/**'
      - '.github/workflows/elixir.yml'
  pull_request:
    paths:
      - 'graphlaw_ex/**'
      - '.github/workflows/elixir.yml'

permissions:
  contents: read

jobs:
  graphlaw_ex-courts:
    name: graphlaw_ex-courts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Fail-closed engine gate: with this set, the engine courts FAIL on a
      # missing/unloadable vendored artifact instead of loud-skipping
      # (graphlaw_ex/test/graphlaw_ex_test.exs, a2a_authority_ceiling_court_test.exs).
      GRAPHLAW_REQUIRE_ENGINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # wasmex 0.15.1 rides rustler_precompiled; when the precompiled NIF
      # misses the platform it falls back to compiling with cargo — keep the
      # same rust toolchain as ci.yml so the fallback is never a red X.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      # TODO: pin to the local asdf versions (brew 1.19.5 currently shadows
      # asdf 1.20.4 — see auto-memory elixir-toolchain-shadowing) once the
      # runner images settle; 1.18/OTP 27 is the current stable pair.
      - uses: erlef/setup-beam@5304e04ea2b355f03681464e683d92e3b2f18451 # v1.18.2
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3'
      - name: Restore deps + _build
        uses: actions/cache@v4
        with:
          path: |
            graphlaw_ex/deps
            graphlaw_ex/_build
          key: mix-${{ runner.os }}-otp27-ex118-${{ hashFiles('graphlaw_ex/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-otp27-ex118-
      - name: mix deps.get
        working-directory: graphlaw_ex
        run: mix deps.get && mix deps.compile
      - name: mix test (engine courts fail-closed)
        working-directory: graphlaw_ex
        run: mix test
