name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: library-backed native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - name: Resolve dependency graph
        run: cargo metadata --format-version 1
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --all-targets --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build WASI module
        run: cargo build -p graphlaw-wasm --target wasm32-wasip1 --profile wasm
      - name: Test backend authorities
        env:
          GRAPHLAW_WASM: ${{ github.workspace }}/target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
        run: cargo test --all-targets --all-features
      - name: Upload WASI module
        uses: actions/upload-artifact@v7
        with:
          name: graphlaw-wasm
          path: target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
      - name: Package both crates together (publish readiness)
        run: cargo package -p graphlaw-eyeron -p graphlaw
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  wasm:
    name: library-backed wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - name: Compile facade for wasm32
        run: cargo check --lib --target wasm32-unknown-unknown
