name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Local equivalent: cargo fmt --check && cargo clippy --all-targets
  # --features pack-tools,abi,wasi-patched-deps,evidentiary-ring -- -D warnings
  # && cargo test --locked --all-targets --features pack-tools,abi,wasi-patched-deps,evidentiary-ring
  native:
    name: native (fmt + clippy + full host suite + registry check)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-wasip1
      # WASI setup: the wasm link REQUIRES a staged toolchain (WASI_SDK_PATH
      # with bin/clang + libc++ for wasm32-wasip1) AND the compiled DuckDB wasm
      # archives in ~/.frozen-duckdb/cache. One composite action now owns the
      # whole recipe (SDK install, archive build with the witnessed uniform
      # new-EH flag set, opcode-level EH-flavor gate before cache admission,
      # WASI_SDK_PATH export); the cache key hashes the action recipe itself.
      # Only the DuckDB engine archives are restored from the cache
      # (~/.frozen-duckdb/cache/v2.0.0-dev-wasm32-wasip1 is the engine archive,
      # NOT the SDK); the SDK itself is wasi-sdk 34, installed fresh at
      # /opt/wasi-sdk, never cached.
      - name: Stage WASI SDK + duckdb wasm archives
        uses: ./.github/actions/wasi-duckdb
      - name: Resolve dependency graph
        run: cargo metadata --format-version 1
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        # castle-diff excluded: pulls nightly-only wasm4pm-compat (E0554 on stable).
        # evidentiary-ring (native SPSC ring) is host-buildable and must not
        # dodge the gate (RUST-8 lane L7).
        run: cargo clippy --all-targets --features pack-tools,abi,wasi-patched-deps,evidentiary-ring -- -D warnings
      - name: Build WASI module
        # The DuckDB-linked artifact requires the exception-handling target
        # feature at link time (new-EH duckdb wasm archive; wasmtime 48 hosts
        # it, wasmi cannot).
        env:
          CARGO_TARGET_WASM32_WASIP1_RUSTFLAGS: -C target-feature=+exception-handling
        run: cargo build --locked -p graphlaw-wasm --target wasm32-wasip1 --profile wasm
      - name: Capability registry is current (graphlaw-registry --check)
        run: cargo run --locked --features abi --bin graphlaw-registry -- --check
      - name: Test backend authorities
        env:
          GRAPHLAW_WASM: ${{ github.workspace }}/target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
        run: cargo test --locked --all-targets --features pack-tools,abi,wasi-patched-deps,evidentiary-ring
      - name: Upload WASI module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: graphlaw-wasm
          path: target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
      - name: Package both crates together (publish readiness)
        run: cargo package -p graphlaw-eyeron -p graphlaw
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --features pack-tools,abi,wasi-patched-deps

  # Nightly-only cross-engine court (L41). Lives in a workspace-excluded crate
  # because ggen-engine -> wasm4pm-compat 26.8.7 is nightly-only (E0554 on
  # stable) and a git dep in the root manifest would trip the publishability
  # manifest check (tests/authority_manifest.rs).
  # Local equivalent (nightly toolchain required): cd courts/castle-diff && cargo +nightly test
  castle-diff:
    name: castle hash-unification court (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      # frozen-duckdb-sys host cmake fails on ubuntu-24.04 with
      # "Could NOT find CURL"; install it before the build runs.
      - name: Install libcurl dev + pkg-config (frozen-duckdb-sys host cmake)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev pkg-config
      - name: Run castle-diff court
        working-directory: courts/castle-diff
        run: cargo +nightly test

  # All 8 loud-skip suites (wasm_size_court, abi_manifest_court, abi_bounds_court,
  # canonical_cross_dialect, parse_refusal_court, tier_court,
  # parser_capability_probe, wasm_native_differential) are LANDED on disk —
  # this job should be GREEN. A "[SKIP-loud]" line here means a suite file was
  # deleted; that is the only acceptable skip. Not an expected-red job.
  # History: this job was red while the WASI link had no staged SDK — the
  # "missing link" era (rust-lld: unable to find library -lduckdb). That link
  # now lands via the staged-toolchain step below (WASI_SDK_PATH + compiled
  # duckdb wasm32 archives). RED here now means the SDK setup broke, not the
  # historical link gap.
  # Local equivalent: cargo build --locked -p graphlaw-wasm --target
  # wasm32-wasip1 --profile wasm, then per-suite cargo test --locked --test <name>.
  wasm-court:
    name: wasm courts (WASI ABI + landed wasm suites)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0 # pinned: matches rust-toolchain.toml
          targets: wasm32-wasip1, wasm32-unknown-unknown
      # WASI setup — same composite staged-SDK + duckdb-archive recipe as the
      # native job above (cache key hashes the action recipe, not this file).
      - name: Stage WASI SDK + duckdb wasm archives
        uses: ./.github/actions/wasi-duckdb
      - name: Compile facade for wasm32-unknown-unknown
        run: cargo check --lib --target wasm32-unknown-unknown
      - name: Build WASI module
        # Same EH link requirement as the native job (DuckDB-linked artifact,
        # wasmtime-hosted; wasmi cannot load it).
        env:
          CARGO_TARGET_WASM32_WASIP1_RUSTFLAGS: -C target-feature=+exception-handling
        run: cargo build --locked -p graphlaw-wasm --target wasm32-wasip1 --profile wasm
      # Post-EH-closure (wasmi retirement): tests/wasm_abi.rs hosts the
      # DuckDB-linked artifact through wasmtime 48 with W3C exceptions
      # (Config::wasm_exceptions) — wasmi 2 rejects that artifact's
      # exception-handling sections, so the old legacy-wasmi framing is gone.
      # Loud skip: continue-on-error so a red run here is visible but not
      # gating — never folded into a passing step silently.
      - name: "[SKIP-loud] ABI court (tests/wasm_abi.rs, wasmtime-48 EH host)"
        continue-on-error: true
        env:
          GRAPHLAW_WASM: ${{ github.workspace }}/target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
        run: cargo test --locked --test wasm_abi --features abi
      - name: Run WASI ABI courts (wasmtime EH host)
        env:
          GRAPHLAW_WASM: ${{ github.workspace }}/target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
        run: >
          cargo test --locked
          --test wasi_patch_guard
          --test wasm_duckdb_lifecycle_eh
          --test wasm_duckdb_op_wired
          --features abi,wasi-patched-deps,runner-eh
      - name: Run landed wasm court suites (loud-skip unlanded)
        env:
          GRAPHLAW_WASM: ${{ github.workspace }}/target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
        run: |
          set -e
          for t in wasm_size_court abi_manifest_court abi_bounds_court canonical_cross_dialect parse_refusal_court tier_court parser_capability_probe wasm_native_differential; do
            if [ -f tests/$t.rs ]; then
              cargo test --locked --test $t
            else
              echo "[SKIP-loud] $t not landed"
            fi
          done

  # RUST-8 (lane L7): every workspace member gets its own clippy+test gate.
  # Plain `cargo test` is the gate — frozen-duckdb is a normal dependency;
  # no job may pass --features duckdb or --no-default-features to dodge it.
  # Local equivalent: cargo test --locked (whole workspace, incl. frozen-duckdb).
  workspace-members:
    name: per-member clippy+test gate (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: graphlaw
            features: pack-tools,abi,wasi-patched-deps,evidentiary-ring
          - package: graphlaw-wasm
            features: ""
          - package: graphlaw-eyeron
            features: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
          components: clippy
      # frozen-duckdb-sys host cmake fails on ubuntu-24.04 with
      # "Could NOT find CURL" (the runner image ships no libcurl dev headers);
      # install it before any cargo step compiles frozen-duckdb-sys.
      - name: Install libcurl dev + pkg-config (frozen-duckdb-sys host cmake)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev pkg-config
      - name: Clippy
        if: matrix.features != ''
        run: cargo clippy --locked -p ${{ matrix.package }} --all-targets --features ${{ matrix.features }} -- -D warnings
      - name: Clippy (no features)
        if: matrix.features == ''
        run: cargo clippy --locked -p ${{ matrix.package }} --all-targets -- -D warnings
      # Plain cargo test = the gate; the whole workspace (incl. frozen-duckdb
      # engine) compiles and runs for every member row.
      - name: Test (workspace gate)
        run: cargo test --locked

  # Local equivalent: cargo install cargo-semver-checks --locked, then
  # cargo semver-checks --package graphlaw (needs a published baseline).
  semver:
    name: semver compatibility (cargo-semver-checks vs published baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
      # frozen-duckdb-sys host cmake fails on ubuntu-24.04 with
      # "Could NOT find CURL"; install it before the build runs.
      - name: Install libcurl dev + pkg-config (frozen-duckdb-sys host cmake)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev pkg-config
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: graphlaw

  # Local equivalent: cargo install cargo-deny --locked, then
  # cargo deny check advisories licenses bans sources.
  deny:
    name: "dependency policy (cargo-deny: advisories, licenses, bans, sources)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  # Local equivalent: cargo install cargo-audit --locked, then cargo audit.
  # NOTE: no rust cache on this job (fresh cargo install ~1-2 min, acceptable);
  # if a shared-cache lane lands, every rust job here should adopt it at once.
  audit:
    name: RustSec advisory audit (cargo-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock
        run: cargo audit

  # External oracle: the IN-REPO pytest suites (tests_py + the pm4pytest BCBS
  # driver in tests/) running against the binaries this repo just built.
  # Chicago-style: real subprocesses, no mocks. Both conftest.py files resolve
  # binaries via GRAPHLAW_REPO / GRAPHLAW_TARGET_DIR env overrides and build
  # their own fixtures (tests_py/conftest.py builds blackbox_fixture with the
  # runner-eh feature), so no feature name is hardcoded into pytest args here.
  # Allow-failure until the suite is stable; flip continue-on-error to false
  # once it has been green across several CI runs.
  external-oracle:
    name: external oracle (in-repo pytest suites)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
      # frozen-duckdb-sys host cmake fails on ubuntu-24.04 with
      # "Could NOT find CURL"; install it before the build runs.
      - name: Install libcurl dev + pkg-config (frozen-duckdb-sys host cmake)
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev pkg-config
      # The BCBS driver conftest (tests/conftest.py) builds the DuckDB-linked
      # wasm artifact itself, which needs WASI_SDK_PATH and the compiled
      # duckdb wasm archives — stage them with the same composite action.
      - name: Stage WASI SDK + duckdb wasm archives
        uses: ./.github/actions/wasi-duckdb
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Build graphlaw bins and the blackbox_fixture example
        run: cargo build --bins --example blackbox_fixture --features runner-eh
      - name: Run in-repo pytest suite
        env:
          GRAPHLAW_REPO: ${{ github.workspace }}
          GRAPHLAW_TARGET_DIR: ${{ github.workspace }}/target/debug
        run: pytest tests_py -v
      - name: Run BCBS aggregation pytest court
        env:
          GRAPHLAW_REPO: ${{ github.workspace }}
          GRAPHLAW_TARGET_DIR: ${{ github.workspace }}/target/debug
        run: pytest tests/test_bcbs_aggregation.py -v
