name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: library-backed native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - name: Resolve dependency graph
        run: cargo metadata --format-version 1
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        # castle-diff excluded: pulls nightly-only wasm4pm-compat (E0554 on stable).
        run: cargo clippy --all-targets --features pack-tools,abi,wasi-patched-deps -- -D warnings
      - name: Build WASI module
        run: cargo build --locked -p graphlaw-wasm --target wasm32-wasip1 --profile wasm
      - name: Capability registry is current (graphlaw-registry --check)
        run: cargo run --locked --features abi --bin graphlaw-registry -- --check
      - name: Test backend authorities
        env:
          GRAPHLAW_WASM: ${{ github.workspace }}/target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
        run: cargo test --locked --all-targets --features pack-tools,abi,wasi-patched-deps
      - name: Upload WASI module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: graphlaw-wasm
          path: target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
      - name: Package both crates together (publish readiness)
        run: cargo package -p graphlaw-eyeron -p graphlaw
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --features pack-tools,abi,wasi-patched-deps

  # Nightly-only cross-engine court (L41). Lives in a workspace-excluded crate
  # because ggen-engine -> wasm4pm-compat 26.8.7 is nightly-only (E0554 on
  # stable) and a git dep in the root manifest would trip the publishability
  # manifest check (tests/authority_manifest.rs).
  castle-diff:
    name: castle hash-unification court (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - name: Run castle-diff court
        working-directory: courts/castle-diff
        run: cargo +nightly test

  wasm-court:
    name: wasm court (WASI + ABI courts)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0 # pinned: matches rust-toolchain.toml
          targets: wasm32-wasip1, wasm32-unknown-unknown
      - name: Compile facade for wasm32-unknown-unknown
        run: cargo check --lib --target wasm32-unknown-unknown
      - name: Build WASI module
        run: cargo build --locked -p graphlaw-wasm --target wasm32-wasip1 --profile wasm
      - name: Run WASI ABI courts
        env:
          GRAPHLAW_WASM: ${{ github.workspace }}/target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
        run: cargo test --locked --test wasm_abi --test wasi_patch_guard --features abi,wasi-patched-deps
      - name: Run landed wasm court suites (loud-skip unlanded)
        env:
          GRAPHLAW_WASM: ${{ github.workspace }}/target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
        run: |
          set -e
          for t in wasm_size_court abi_manifest_court abi_bounds_court canonical_cross_dialect parse_refusal_court tier_court parser_capability_probe wasm_native_differential; do
            if [ -f tests/$t.rs ]; then
              cargo test --locked --test $t
            else
              echo "[SKIP-loud] $t not landed"
            fi
          done

  semver:
    name: semver (cargo-semver-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: graphlaw

  deny:
    name: cargo-deny (advisories licenses bans sources)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.96.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock
        run: cargo audit
