name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: library-backed native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - name: Resolve dependency graph
        run: cargo metadata --format-version 1
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --all-targets --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build WASI module
        run: cargo build -p graphlaw-wasm --target wasm32-wasip1 --profile wasm
      - name: Test backend authorities
        env:
          GRAPHLAW_WASM: ${{ github.workspace }}/target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
        run: cargo test --all-targets --all-features
      - name: Upload WASI module
        uses: actions/upload-artifact@v4
        with:
          name: graphlaw-wasm
          path: target/wasm32-wasip1/wasm/graphlaw_wasm.wasm
      - name: Package both crates together (publish readiness)
        run: cargo package -p graphlaw-eyeron -p graphlaw
      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  wasm:
    name: library-backed wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - name: Compile facade for wasm32
        run: cargo check --lib --target wasm32-unknown-unknown

  semver:
    name: semver (cargo-semver-checks)
    runs-on: ubuntu-latest
    # continue-on-error while v26.9.29 is unreleased: it intentionally breaks the
    # public API against the latest crates.io baseline (26.9.28), so a failure here
    # is informational until the release lands. Remove this line after v26.9.29 ships.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: graphlaw

  deny:
    name: cargo-deny (advisories licenses bans sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Cargo.lock
        run: cargo audit
