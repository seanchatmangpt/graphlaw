name: js

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'registry/**'
      - '.github/workflows/js.yml'
  pull_request:
    paths:
      - 'js/**'
      - 'registry/**'
      - '.github/workflows/js.yml'

permissions:
  contents: read

concurrency:
  group: js-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-build:
    name: build wasm + js dist
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # RELEASE_HOLD is a release.yml gate; mirrored here so a hold freezes the
    # JS surface too (nothing new is built or shipped while held).
    if: vars.RELEASE_HOLD != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.96.0
          targets: wasm32-wasip1
      - name: Build WASI module (wasm profile)
        run: cargo build -p graphlaw-wasm --target wasm32-wasip1 --profile wasm --locked
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/npm/package-lock.json
      - name: Verify WASI module ABI surface matches the pinned artifact
        shell: bash
        run: |
          set -euo pipefail
          # Byte-level drift guard: the committed pin must still match the
          # committed artifact bytes (catches hand edits and stale pins).
          expected=$(awk '{print $1}' priv/graphlaw.wasm.sha256)
          actual=$(shasum -a 256 priv/graphlaw.wasm | awk '{print $1}')
          echo "pinned artifact: $actual"
          echo "pin file:        $expected"
          [ "$actual" = "$expected" ] || { echo "ERROR: priv/graphlaw.wasm bytes drifted from priv/graphlaw.wasm.sha256; repin the artifact"; exit 1; }
          # Semantic ABI gate: the wasm build is NOT byte-reproducible across
          # host platforms. Even with --remap-path-prefix normalizing the
          # embedded panic-location paths (macOS /Users/sac/.cargo vs Linux
          # /usr/local/cargo), rustc/LLVM emit the merged string-constant pool
          # in a host-dependent order, so a Linux rebuild of the same source,
          # lockfile and toolchain can never equal the macOS-built pin
          # byte-for-byte (witnessed: macOS 21262fe8, CI Linux bf2bdd8f,
          # linux-aarch64 docker 13dab85c). The rebuild is therefore compared
          # on its import/export ABI surface instead; byte authority remains
          # with the committed pin (guard above + js-drift + build.mjs).
          node -e '
          const { createHash } = require("node:crypto");
          const { readFileSync } = require("node:fs");
          const abiHash = (path) => {
            const mod = new WebAssembly.Module(readFileSync(path));
            const exports = WebAssembly.Module.exports(mod).map(e => e.name + ":" + e.kind).sort();
            const imports = WebAssembly.Module.imports(mod).map(e => e.module + "/" + e.name + ":" + e.kind).sort();
            return createHash("sha256").update(exports.join("|") + "#" + imports.join("|")).digest("hex");
          };
          const fresh = abiHash("target/wasm32-wasip1/wasm/graphlaw_wasm.wasm");
          const pinned = abiHash("priv/graphlaw.wasm");
          console.log("fresh rebuild ABI: " + fresh);
          console.log("pinned artifact ABI: " + pinned);
          if (fresh !== pinned) {
            console.error("ERROR: rebuilt wasm ABI surface differs from pinned artifact; repin priv/graphlaw.wasm");
            process.exit(1);
          }
          '
      - name: Build JS distributions
        working-directory: js/npm
        run: npm ci && npm run build
      - name: Upload JS dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: graphlaw-js-dist
          path: |
            js/npm/dist-nodejs/**
            js/npm/dist-web/**
            js/npm/dist-bundler/**
            js/npm/wasm/**

  js-test-node:
    name: node tests (node ${{ matrix.node }})
    needs: js-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: vars.RELEASE_HOLD != 'true'
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: graphlaw-js-dist
          path: js/npm
      - name: Install
        working-directory: js/npm
        run: npm ci
      - name: Typecheck
        working-directory: js/npm
        run: npm run typecheck
      - name: Test
        working-directory: js/npm
        run: npm run test

  js-test-browser:
    name: browser tests
    needs: js-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: vars.RELEASE_HOLD != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: graphlaw-js-dist
          path: js/npm
      - name: Install
        working-directory: js/npm
        run: npm ci
      # Browser tests require a real Chromium via playwright. We do NOT run
      # `npx playwright-core install chromium` here: the `install` command
      # ships in the `playwright` package, not `playwright-core`, so it would
      # fail on this dependency set. The browser suite self-skips cleanly
      # (exit 0) when no browser binary is available, so running it is safe:
      # it either executes for real (when playwright is resolvable) or skips
      # without failing the job. GRAPHLAW_BROWSER_TESTS=1 opts the suite in.
      - name: Browser tests
        working-directory: js/npm
        env:
          GRAPHLAW_BROWSER_TESTS: '1'
        run: npm run test:browser

  js-package-lint:
    name: package lint + pack smoke
    needs: js-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: vars.RELEASE_HOLD != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: graphlaw-js-dist
          path: js/npm
      - name: Install
        working-directory: js/npm
        run: npm ci
      - name: Package lint
        working-directory: js/npm
        run: npm run lint:pkg
      - name: Pack smoke
        working-directory: js/npm
        run: node scripts/pack-smoke.mjs

  js-drift:
    name: generated + version drift
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: vars.RELEASE_HOLD != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.96.0
          targets: wasm32-wasip1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/npm/package-lock.json
      - name: package.json version matches workspace
        run: |
          set -euo pipefail
          node js/npm/scripts/sync-version.mjs
          git diff --exit-code -- js/npm/package.json
      - name: artifact-meta.ts is current (rebuild wasm, repin, diff)
        run: |
          set -euo pipefail
          # Build-health gate: the tree must still produce the wasm artifact.
          # NOTE: the rebuild's bytes are NOT digest-compared here — the wasm
          # build is not byte-reproducible across host platforms (macOS and
          # Linux rebuilds of the same source/lock differ), so the artifact pin
          # (priv/graphlaw.wasm + priv/graphlaw.wasm.sha256) is the authority.
          cargo build -p graphlaw-wasm --target wasm32-wasip1 --profile wasm --locked
          # Re-pin artifact-meta.ts from the committed, pinned artifact; any
          # hand edit or stale digest in js/npm/src/generated fails the job.
          node js/npm/scripts/build.mjs
          git diff --exit-code -- js/npm/src/generated
      - name: generated types are current
        working-directory: js/npm
        run: |
          set -euo pipefail
          npm ci
          npm run gen
          git diff --exit-code -- src/generated
