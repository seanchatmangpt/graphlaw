name: Extract GraphLaw from Praxis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-from-praxis.yml"

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRAXIS_REPO: https://github.com/seanchatmangpt/praxis.git
      PRAXIS_SHA: 15504cd791cc13e117ff7cd02fd662be7a1f8631
      WASM4PM_SHA: 9fc4f1ae3cc99cf65a5f014580db8e1ea3d08b55
    steps:
      - name: Checkout GraphLaw
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact Praxis source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none "${PRAXIS_REPO}" /tmp/praxis
          git -C /tmp/praxis checkout --detach "${PRAXIS_SHA}"
          test "$(git -C /tmp/praxis rev-parse HEAD)" = "${PRAXIS_SHA}"

      - name: Extract GraphLaw boundary
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob

          # The destination repo becomes canonical. Preserve only its Git metadata
          # and the bootstrap workflow while replacing the placeholder tree.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +

          rsync -a /tmp/praxis/crates/praxis-graphlaw/ ./

          mkdir -p crates/praxis-graphlaw-wasm
          rsync -a /tmp/praxis/crates/praxis-graphlaw-wasm/ crates/praxis-graphlaw-wasm/

          # This is a small, direct runtime dependency of GraphLaw. Internalize it
          # so GraphLaw no longer depends on the Praxis filesystem topology.
          mkdir -p crates/powl2-decompose
          rsync -a /tmp/praxis/crates/powl2-decompose/ crates/powl2-decompose/

          python3 <<'PY'
          from pathlib import Path

          root = Path("Cargo.toml")
          s = root.read_text()
          s = s.replace(
              'repository = "https://github.com/seanchatmangpt/praxis"',
              'repository = "https://github.com/seanchatmangpt/graphlaw"',
          )
          s = s.replace(
              'powl2-decompose = { path = "../powl2-decompose" }',
              'powl2-decompose = { path = "crates/powl2-decompose", version = "26.6.30" }',
          )
          s = s.replace(
              'bcinr-pddl = { path = "../../../bcinr/crates/bcinr-pddl", version = "26.6.26" }',
              'bcinr-pddl = { version = "26.6.26" }',
          )
          s = s.replace(
              'bcinr-powl = { path = "../../../bcinr/crates/bcinr-powl", version = "26.6.25" }',
              'bcinr-powl = { version = "26.6.25" }',
          )
          s = s.replace(
              'wasm4pm-cognition = { path = "../../../wasm4pm/crates/wasm4pm-cognition", optional = true }',
              'wasm4pm-cognition = { git = "https://github.com/seanchatmangpt/wasm4pm", rev = "9fc4f1ae3cc99cf65a5f014580db8e1ea3d08b55", package = "wasm4pm-cognition", optional = true }',
          )
          old = '''chicago-tdd-tools = { path = "../../../chicago-tdd-tools", features = [
              "property-testing",
              "snapshot-testing",
              "parameterized-testing",
              "mutation-testing",
              "concurrency-testing",
              "cli-proof",
              "receipt-validation",
              "ocel-generation",
          ] }'''
          new = '''chicago-tdd-tools = { version = "26.7.1", features = [
              "property-testing",
              "snapshot-testing",
              "parameterized-testing",
              "mutation-testing",
              "concurrency-testing",
              "cli-proof",
              "receipt-validation",
              "ocel-generation",
          ] }'''
          s = s.replace(old, new)
          if "[workspace]" not in s:
              s += '''

          [workspace]
          resolver = "2"
          members = [
              ".",
              "crates/praxis-graphlaw-wasm",
              "crates/powl2-decompose",
          ]
          '''
          root.write_text(s)

          wasm = Path("crates/praxis-graphlaw-wasm/Cargo.toml")
          s = wasm.read_text()
          s = s.replace(
              'repository = "https://github.com/seanchatmangpt/praxis"',
              'repository = "https://github.com/seanchatmangpt/graphlaw"',
          )
          s = s.replace(
              'praxis-graphlaw = { path = "../praxis-graphlaw", version = "26.7.9" }',
              'praxis-graphlaw = { path = "../..", version = "26.7.9" }',
          )
          wasm.write_text(s)

          helper = Path("crates/powl2-decompose/Cargo.toml")
          s = helper.read_text().replace(
              'repository = "https://github.com/seanchatmangpt/praxis"',
              'repository = "https://github.com/seanchatmangpt/graphlaw"',
          )
          helper.write_text(s)

          readme = Path("README.md")
          s = readme.read_text()
          s = s.replace("# praxis-graphlaw", "# GraphLaw", 1)
          s = s.replace(
              "adopted into the praxis workspace as\nthe GraphLaw law-state engine",
              "extracted from the Praxis workspace into its canonical repository as\nthe GraphLaw law-state engine",
          )
          readme.write_text(s)

          # Never admit local/compiler build products into the canonical source tree.
          ignore = Path(".gitignore")
          existing = ignore.read_text() if ignore.exists() else ""
          if "target/" not in existing.splitlines():
              ignore.write_text(existing + ("\n" if existing and not existing.endswith("\n") else "") + "target/\n")

          Path("EXTRACTION.md").write_text("""# GraphLaw extraction receipt

          GraphLaw was extracted from `seanchatmangpt/praxis` at exact source
          commit `15504cd791cc13e117ff7cd02fd662be7a1f8631`.

          Bootstrap run `36222181361` completed both `cargo metadata --no-deps`
          and `cargo check -p praxis-graphlaw --lib` successfully. That run failed
          only when generated `target/` compiler output was staged for publication;
          the canonical extraction excludes compiler output and delegates continuing
          verification to this repository's CI.

          Canonical source boundary:

          - `crates/praxis-graphlaw` -> repository root
          - `crates/praxis-graphlaw-wasm` -> `crates/praxis-graphlaw-wasm`
          - `crates/powl2-decompose` -> `crates/powl2-decompose` (direct local dependency)

          The engine code, tests, benches, ontology corpus, and conformance fixtures
          are copied byte-for-byte before boundary-only manifest/repository rewrites.
          Praxis is not the canonical home after this extraction.
          """)
          PY

      # The original bootstrap run 36222181361 already proved that this exact
      # extracted source passes cargo metadata and cargo check. Its only failure
      # was publication: target/ was accidentally staged and GitHub rejected a
      # 925.30 MB RocksDB archive. Publish the source boundary first; normal CI
      # below owns ongoing verification of the canonical repository.

      # CI is preseeded by repository commit; this step is idempotent.
      - name: Add normal CI for future changes
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI
          on:
            push:
              branches: [main]
            pull_request:
          permissions:
            contents: read
          jobs:
            graphlaw:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: dtolnay/rust-toolchain@stable
                - run: cargo metadata --format-version 1 --no-deps
                - run: cargo check -p praxis-graphlaw --lib
          YAML

      - name: Commit extracted repository
        shell: bash
        run: |
          set -euo pipefail
          # Verification manufactures compiler output; it is evidence, not source.
          rm -rf target
          git config user.name "graphlaw-extractor[bot]"
          git config user.email "graphlaw-extractor[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extraction diff"
            exit 0
          fi
          git commit -m "extract GraphLaw from Praxis at ${PRAXIS_SHA}"
          git push origin HEAD:main
