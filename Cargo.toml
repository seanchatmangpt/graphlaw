[package]
name = "graphlaw"
version = "26.10.13"
edition = "2024"
rust-version = "1.96"
authors = ["Sean Chatman"]
license = "MIT"
description = "GraphLaw: library-backed RDF law-state composition over PurRDF and Eyeron"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/MIGRATION.md", "/CHANGELOG.md", "/SECURITY.md", "/CONTRIBUTING.md", "/docs/**", "/examples/**"]
repository = "https://github.com/seanchatmangpt/graphlaw"
keywords = ["rdf", "n3", "datalog", "shacl", "shex"]
categories = ["data-structures", "parser-implementations"]

[workspace]
members = [".", "wasm", "crates/graphlaw-eyeron"]
exclude = ["vendor/purrdf-sparql-eval", "courts/castle-diff"]

# Size-optimised profile for the WebAssembly module (`--profile wasm`); kept
# separate so native release builds and tests are unaffected.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "graphlaw"
path = "src/lib.rs"

[dependencies]
purrdf = "=2.0.2"
frozen-duckdb = { path = "/Users/sac/frozen-duckdb/crates/frozen-duckdb", version = "2.0.0-dev", optional = true }
# SECURITY (supply-chain note): sha2 0.10.9 remains in the tree ONLY as a
# transitive dep of the purrdf family (purrdf-core 2.0.2 declares sha2 = "0.10")
# and ed25519-dalek 2.2.0 (sha2 = "0.10", exact-pinned per GOALS.md invariant 3).
# graphlaw itself hashes exclusively with BLAKE3; it does not depend on sha2
# directly, and the transitive pins cannot be [patch]ed without forking upstream.
# Revisit if purrdf or ed25519-dalek publishes sha2-0.11-compatible releases.
# Verified via: cargo tree -i sha2@0.10.9   (purrdf-core/ed25519-dalek roots)
# Ed25519 receipt/lease attestations (BSD-3-Clause). Exact pin per GOALS.md invariant 3;
# already resolved in Cargo.lock via purrdf. No RNG: keys come from caller-supplied seeds.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
# Receipt-chain family (src/receipt_chain.rs): BLAKE3 frame/chain hashing,
# hex hash fields, serde wire shapes. The OcelCausalFrame primitives
# (99-byte to_hash_bytes packing + BLAKE3 chain rule) are ported verbatim
# into src/receipt_chain.rs::frame from bcinr-powl-receipt 26.7.28 — the
# crates.io dep itself pulls bcinr-powl -> wasm4pm-compat, which is
# nightly-only and cannot build under graphlaw's pinned stable toolchain.
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
regex = { version = "1", optional = true }
serde_json = "1"
eyeron = { package = "graphlaw-eyeron", version = "0.7.8", path = "crates/graphlaw-eyeron" }
[features]
# `abi` on by default: the JSON request/response ABI (src/abi.rs) carries no
# extra dependencies (serde_json is a required dep), and without it the
# default dev profile cannot compile the abi-backed bins, examples, and
# integration tests (E0432 on graphlaw::abi under plain `cargo test`).
default = ["abi"]
# Capture/rewrite tooling for packs/self-monitoring-pack (replaces the former
# Python scripts). Off by default so the library stays dependency-light.
pack-tools = ["dep:regex"]
# Native-only SQL evaluation (frozen-duckdb): excluded from the wasm target.
# Rules referencing `gl:evalSql` without this feature are refused at admission.
duckdb = ["dep:frozen-duckdb"]
# JSON request/response ABI (src/abi.rs) consumed by the wasm module in ./wasm.
# (serde_json is now a required dependency for the receipt-chain family, so the
# former `dep:serde_json` toggles are no-ops kept for feature compatibility.)
abi = []
# Asserts that the build applied the vendored WASI clock patch (see
# vendor/README.md). Only the repo workspace (crates.io ignores [patch]) sets it.
wasi-patched-deps = []
# GWS-18: `graphlaw-run` — a packet-4 stdio host for the compiled wasm module
# (wasmi, mirroring tests/wasm_abi.rs's Host), speaking the smalt sandbox
# runner protocol. Host-only (wasmi cannot compile for wasm32), so the deps are
# target-scoped and optional; off by default, on via --features runner.
runner = ["dep:wasmi", "dep:wasmi_wasi"]

[[bin]]
name = "smon-transcript-to-turtle"
path = "src/bin/smon_transcript_to_turtle.rs"
required-features = ["pack-tools"]

[[bin]]
name = "smon-broaden-topic"
path = "src/bin/smon_broaden_topic.rs"
required-features = ["pack-tools"]

[[bin]]
name = "graphlaw-verify"
path = "src/bin/graphlaw_verify.rs"
required-features = ["abi"]

# GWS-18: stdio runner/adapter between the smalt sandbox port driver
# (packet-4 JSON over stdio) and the real compiled wasm module via wasmi.
[[bin]]
name = "graphlaw-run"
path = "src/bin/graphlaw_run.rs"
required-features = ["runner"]

[[bin]]
name = "graphlaw-registry"
path = "src/bin/graphlaw_registry.rs"
required-features = ["abi"]

[package.metadata.docs.rs]
all-features = true

# Host-side wasm runtime for the `runner` feature (graphlaw-run) and the abi
# integration tests. Optional in [dependencies] (bins cannot see dev-deps);
# tests keep their unconditional dev-dependency below.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmi = { version = "2", optional = true }
wasmi_wasi = { version = "2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wasmi = "2"
wasmi_wasi = "2"
serde_json = "1"

# Carried patch (see vendor/README.md): gives WASI the std clock/RNG path instead
# of the browser-only `js_sys` calls, which panic on any wasm32 target that is
# not wasm32-unknown-unknown. Patches are ignored by `cargo publish`; the
# repo-built WASI module is the artifact that carries it.
[patch.crates-io]
purrdf-sparql-eval = { path = "vendor/purrdf-sparql-eval" }

# Line tables are enough for backtraces; full debuginfo made each of the many
# integration-test binaries huge (tens of GB across the suite).
[profile.dev]
debug = "line-tables-only"

# The wasm runtime used by tests/wasm_abi.rs is an interpreter; unoptimised it
# is ~50x slower and makes the suite take minutes.
# debug-assertions must also be off: wasmi 2's default dispatch is tail-call
# threaded and relies on LLVM sibling-call optimisation. With the dev profile's
# debug assertions on, the handlers are not tail-called, every wasm instruction
# adds a native frame, and any non-trivial guest call overflows the test
# thread's 2 MiB stack ("fatal runtime error: stack overflow").
[profile.dev.package.wasmi]
opt-level = 3
overflow-checks = false
debug-assertions = false
[profile.dev.package.wasmi_core]
opt-level = 3
overflow-checks = false
debug-assertions = false
[profile.dev.package.wasmi_ir]
opt-level = 3
overflow-checks = false
debug-assertions = false
[profile.dev.package.wasmi_collections]
opt-level = 3
overflow-checks = false
debug-assertions = false
[profile.dev.package.wasmi_wasi]
opt-level = 3
overflow-checks = false
debug-assertions = false

[[bin]]
name = "sa2a-portability-verify"
path = "src/bin/sa2a_portability_verify.rs"
required-features = ["abi"]

[[bin]]
name = "sa2a-run14-verify"
path = "src/bin/sa2a_run14_verify.rs"
required-features = ["abi"]

# The seven vector-gen examples (af3c169) are also first-class bins so
# tests/corpus_conformance.rs can execute them for real (CARGO_BIN_EXE_*) and
# consume their emitted vectors through the corpus verification. Same file
# compiles as both an example and a bin; required-features keeps them out of
# feature-light builds.
[[bin]]
name = "allen_datalog"
path = "examples/allen_datalog.rs"
required-features = ["abi"]

[[bin]]
name = "asp_tableaux_vector_gen"
path = "examples/asp_tableaux_vector_gen.rs"
required-features = ["abi"]

[[bin]]
name = "bayes_pop_vectors"
path = "examples/bayes_pop_vectors.rs"
required-features = ["abi"]

[[bin]]
name = "breed_oracle_gen"
path = "examples/breed_oracle_gen.rs"
required-features = ["abi"]

[[bin]]
name = "event_calculus_vectors"
path = "examples/event_calculus_vectors.rs"
required-features = ["abi"]

[[bin]]
name = "naive_physics_vectors"
path = "examples/naive_physics_vectors.rs"
required-features = ["abi"]

[[bin]]
name = "plan_replay_oracle_gen"
path = "examples/plan_replay_oracle_gen.rs"
required-features = ["abi"]

[[bin]]
name = "graphlaw-attest"
path = "src/bin/graphlaw_attest.rs"

# GLR-11: duckdb targets (native-only; require the `duckdb` feature)
[[example]]
name = "sql_in_rdf_duckdb"
path = "examples/sql_in_rdf_duckdb.rs"
required-features = ["duckdb"]

[[test]]
name = "test_edge_sovereign_ingestion"
path = "tests/test_edge_sovereign_ingestion.rs"
required-features = ["duckdb"]

[[test]]
name = "gws4_ipc_injection_court"
path = "tests/gws4_ipc_injection_court.rs"
required-features = ["duckdb"]

[[test]]
name = "test_parquet_and_builtin_eval"
path = "tests/test_parquet_and_builtin_eval.rs"
required-features = ["duckdb"]

[[test]]
name = "test_cold_chain_ocel"
path = "tests/test_cold_chain_ocel.rs"
required-features = ["duckdb"]

[[test]]
name = "wasm_duckdb_op"
path = "tests/wasm_duckdb_op.rs"
required-features = ["duckdb"]

[[example]]
name = "cold_chain_biologics_verification"
path = "examples/cold_chain_biologics_verification.rs"
required-features = ["duckdb"]
