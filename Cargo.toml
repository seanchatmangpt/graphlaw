[package]
name = "graphlaw"
version = "26.10.28"
edition = "2024"
rust-version = "1.98"
authors = ["Sean Chatman"]
license = "MIT"
description = "GraphLaw: library-backed RDF law-state composition over PurRDF"
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE.md", "/MIGRATION.md", "/CHANGELOG.md", "/SECURITY.md", "/CONTRIBUTING.md", "/docs/**", "/examples/**", "/ontologies/**", "/ggen/**"]
repository = "https://github.com/seanchatmangpt/graphlaw"
keywords = ["rdf", "n3", "datalog", "shacl", "shex"]
categories = ["data-structures", "parser-implementations"]

[workspace]
members = [".", "wasm"]
exclude = ["courts/castle-diff"]

# Size-optimised profile for the WebAssembly module (`--profile wasm`); kept
# separate so native release builds and tests are unaffected.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Debug twin of [profile.wasm]: keeps the wasm name section so wasmtime trap
# backtraces show symbol names instead of <unknown> (SQLRDF-24 diagnosis aid;
# NOT for pinning — the pinned artifact stays strip=true).
[profile.wasm-syms]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"


[lib]
name = "graphlaw"
path = "src/lib.rs"

[dependencies]
# The purrdf family comes from ONE source: the rev-pinned fork. The WASI clock
# gate and the P01 proof-checker hardening live at this rev (branch
# graphlaw-carried). No crates.io fallback: a git-only dependency is the supply
# chain, enforced by deny.toml [sources] and CI's fork-provenance step.
purrdf = { git = "https://github.com/seanchatmangpt/purrdf", rev = "2223f8945e19eb9aed750fe038b0fa833bd17c83" }
purrdf-columnar = { git = "https://github.com/seanchatmangpt/purrdf", rev = "2223f8945e19eb9aed750fe038b0fa833bd17c83" }
# SECURITY (supply-chain note): sha2 0.10.9 remains in the tree via
# wasmtime-environ/cranelift-codegen (dev-dep family) and ed25519-dalek 2.2.0
# (sha2 = "0.10", exact-pinned per GOALS.md invariant 3); the purrdf family
# (git-sourced above) moved to sha2 0.11 at purrdf-core 3.0.1 (purrdf dropped
# ed25519-dalek at 3.0.0 in favor of first-party purrdf-ed25519).
# graphlaw itself hashes exclusively with BLAKE3; it does not depend on sha2
# directly, and the transitive sha2 pins come in via wasmtime/ed25519-dalek.
# Revisit if wasmtime or ed25519-dalek publishes sha2-0.11-compatible releases.
# Verified via: cargo tree -i sha2@0.10.9
# Ed25519 receipt/lease attestations (BSD-3-Clause). Exact pin per GOALS.md invariant 3;
# already resolved in Cargo.lock via purrdf. No RNG: keys come from caller-supplied seeds.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
# Receipt-chain family (src/receipt_chain.rs): BLAKE3 frame/chain hashing,
# hex hash fields, serde wire shapes. The OcelCausalFrame primitives
# (99-byte to_hash_bytes packing + BLAKE3 chain rule) are ported verbatim
# into src/receipt_chain.rs::frame from bcinr-powl-receipt 26.7.28 — the
# crates.io dep itself pulls bcinr-powl -> wasm4pm-compat, which is
# nightly-only and cannot build under graphlaw's pinned stable toolchain.
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
regex = { version = "1", optional = true }
serde_json = "1"
rtrb = { version = "0.3", optional = true }
# frozen-duckdb links into the ONE unit on every target, wasm32 included: the
# wasm static archive is built with -fwasm-exceptions -mllvm
# -wasm-use-legacy-eh=0 (uniform W3C EH) and hosted by wasmtime 48
# (Config::wasm_exceptions). DuckDB is not a feature (repo law).
frozen-duckdb = { version = "2.0.2" }
[features]
# P28-SIL §3.2: SPSC evidentiary ring + query ledger (src/evidence_ring.rs,
# src/query_ledger.rs). Default OFF; native-only (drainer thread, host files);
# rtrb is the lock-free SPSC core.
evidentiary-ring = ["dep:rtrb"]
# `abi` on by default: the JSON request/response ABI (src/abi.rs) carries no
# extra dependencies (serde_json is a required dep), and without it the
# default dev profile cannot compile the abi-backed bins, examples, and
# integration tests (E0432 on graphlaw::abi under plain `cargo test`).
default = ["abi"]
# Capture/rewrite tooling for packs/self-monitoring-pack (replaces the former
# Python scripts). Off by default so the library stays dependency-light.
pack-tools = ["dep:regex"]
# JSON request/response ABI (src/abi.rs) consumed by the wasm module in ./wasm.
# (serde_json is now a required dependency for the receipt-chain family, so the
# former `dep:serde_json` toggles are no-ops kept for feature compatibility.)
abi = []
# Wasmtime-based EH host for the DuckDB-linked artifact (bin graphlaw-run-eh).
runner-eh = ["dep:wasmtime", "dep:wasmtime-wasi"]

[[bin]]
name = "smon-transcript-to-turtle"
path = "src/bin/smon_transcript_to_turtle.rs"
required-features = ["pack-tools"]

[[bin]]
name = "smon-broaden-topic"
path = "src/bin/smon_broaden_topic.rs"
required-features = ["pack-tools"]

[[bin]]
name = "graphlaw-verify"
path = "src/bin/graphlaw_verify.rs"
required-features = ["abi"]

# EH-capable host (wasmtime 48, new W3C exceptions) for the DuckDB-linked
# artifact — the sole packet-4 stdio runner after the wasmi retirement
# (docs/jira/v26.10.23/ADR-wasmi-retirement.md).
[[bin]]
name = "graphlaw-run-eh"
path = "src/bin/graphlaw_run_eh.rs"
required-features = ["runner-eh"]

[[bin]]
name = "graphlaw-registry"
path = "src/bin/graphlaw_registry.rs"
required-features = ["abi"]

# Charter A08 measurement-isolation lane: tc_hot_01 is a harness=false
# bench binary (custom main, not libtest). It times the receipt fold and
# the refusal render. DuckDB scan and prepare timing is not a graphlaw bench.
[[bench]]
name = "sql_rdf_compiler"
harness = false

[[bench]]
name = "sql_rdf_engine"
harness = false

[[bench]]
name = "workload_amortization"
harness = false

[[bench]]
# SB-50MS — statutory boundary benchmark (EU AI Act Art. 12/14/15 gates:
# receipt issuance, fail-closed SHACL boundary, bounded N3 derivation).
name = "statutory_boundary_50ms"
harness = false

[[bench]]
name = "sql_rdf_egress"
harness = false

[[bench]]
name = "sql_rdf_admission"
harness = false

[[bench]]
name = "tc_hot_01"
harness = false

[[bench]]
name = "purrdf_columnar_engine"
harness = false

[[bench]]
# P07 - SHACL boundary-cliff bench (depth/degree/bytes sweeps over the real
# admission boundary; caps picked from ITS measured cliffs, not guessed).
name = "shacl_boundary_cliff"
harness = false

[[bench]]
# P08 - sieve cliff bench (result-row envelope vs raw substrate: reduce
# cold/warm-stmt/warm-cache + refuse + raw control over N in {1e4..1e6}).
name = "sieve_cliff"
harness = false

# docs.rs feature pin: frozen-duckdb-sys has a DOCS_RS branch that skips native
# builds, so the native toolchain docs.rs uses is fine — the feature set is what
# needs pinning. (graphlaw does not publish to crates.io; this table is kept for
# a future docs host. The purrdf fork is git-pinned above.)
[package.metadata.docs.rs]
features = ["abi", "evidentiary-ring", "pack-tools"]

# Host-side wasm runtime for the `runner-eh` feature (graphlaw-run-eh) and the
# abi integration tests. Optional in [dependencies] (bins cannot see dev-deps);
# tests keep their unconditional dev-dependency below.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "50", optional = true, features = ["runtime"] }
wasmtime-wasi = { version = "48", optional = true }
# GWS-18 successor: hosts the DuckDB-linked wasm artifact with wasmtime 48
# new-style EH (Config::wasm_exceptions). The frozen-duckdb wasm static
# archive is rebuilt with -fwasm-exceptions -mllvm -wasm-use-legacy-eh=0
# (uniform W3C EH), so the ONE unit links DuckDB on every target.

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
divan = "0.1"

# EH lifecycle court (tests/wasm_duckdb_lifecycle_eh.rs): hosts the
# DuckDB-linked artifact under wasmtime 48 with new W3C exceptions.
wasmtime = { version = "50", features = ["runtime"] }
wasmtime-wasi = "48"
serde_json = "1"
hdrhistogram = "7"

# Line tables are enough for backtraces; full debuginfo made each of the many
# integration-test binaries huge (tens of GB across the suite).
[profile.dev]
debug = "line-tables-only"

[[bin]]
name = "sa2a-portability-verify"
path = "src/bin/sa2a_portability_verify.rs"
required-features = ["abi"]

[[bin]]
name = "sa2a-run14-verify"
path = "src/bin/sa2a_run14_verify.rs"
required-features = ["abi"]

# The seven vector-gen examples (af3c169) are also first-class bins so
# tests/corpus_conformance.rs can execute them for real (CARGO_BIN_EXE_*) and
# consume their emitted vectors through the corpus verification. Same file
# compiles as both an example and a bin; required-features keeps them out of
# feature-light builds.
[[bin]]
name = "allen_datalog"
path = "examples/allen_datalog.rs"
required-features = ["abi"]

[[bin]]
name = "asp_tableaux_vector_gen"
path = "examples/asp_tableaux_vector_gen.rs"
required-features = ["abi"]

[[bin]]
name = "bayes_pop_vectors"
path = "examples/bayes_pop_vectors.rs"
required-features = ["abi"]

[[bin]]
name = "breed_oracle_gen"
path = "examples/breed_oracle_gen.rs"
required-features = ["abi"]

[[bin]]
name = "event_calculus_vectors"
path = "examples/event_calculus_vectors.rs"
required-features = ["abi"]

[[bin]]
name = "naive_physics_vectors"
path = "examples/naive_physics_vectors.rs"
required-features = ["abi"]

[[bin]]
name = "plan_replay_oracle_gen"
path = "examples/plan_replay_oracle_gen.rs"
required-features = ["abi"]

[[bin]]
name = "graphlaw-attest"
path = "src/bin/graphlaw_attest.rs"

[[example]]
name = "sql_in_rdf_duckdb"
path = "examples/sql_in_rdf_duckdb.rs"

[[test]]
name = "test_edge_sovereign_ingestion"
path = "tests/test_edge_sovereign_ingestion.rs"

[[test]]
name = "gws4_ipc_injection_court"
path = "tests/gws4_ipc_injection_court.rs"

[[test]]
name = "test_parquet_and_builtin_eval"
path = "tests/test_parquet_and_builtin_eval.rs"

[[test]]
name = "test_cold_chain_ocel"
path = "tests/test_cold_chain_ocel.rs"

[[test]]
name = "wasm_duckdb_op"
path = "tests/wasm_duckdb_op.rs"

[[example]]
name = "cold_chain_biologics_verification"
path = "examples/cold_chain_biologics_verification.rs"
