[package]
name = "praxis-graphlaw"
version = "26.7.9"
edition = "2021"
description = "Praxis GraphLaw law-state engine: native N3, Datalog, SPARQL 1.1, SHACL, ShEx (fork of pbonte/roxi)"
license = "MIT"
repository = "https://github.com/seanchatmangpt/graphlaw"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
deepmesa-collections = "0.14.0"
bencher = "0.1.5"
log = { version = "0.4"}
env_logger = "0.11.11"
spargebra = "=0.4.6"
sparesults = "=0.3.3"


rio_api = "0.8.6"
rio_turtle = "0.8.6"
rio_xml = "0.8.6"
pest = "2.8.7"
pest_derive = "2.8.7"
either = "1.16.0"
once_cell = "1.21.4"
oxrdf = { version = "=0.3.3", features = ["rdfc-10"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
blake3 = "1"
md5 = "0.8.0"
rustc-hash = "2"
smallvec = { version = "1", features = ["serde"] }
fixedbitset = "0.5"
oxigraph = { version = "0.5.9", features = ["rdf-12"] }
powl2-decompose = { path = "crates/powl2-decompose", version = "26.6.30" }
bcinr-pddl = { version = "=26.7.28" }
bcinr-powl = { version = "=26.7.28" }
thiserror = "2"
# compat owns receipt identity; all chatman hashing routes through wasm4pm_compat::hash.
# Exact published identities reconstructed from Praxis's extraction-source Cargo.lock.
# The original GraphLaw crate used sibling path dependencies whose package versions had
# advanced beyond the stale lower bounds in this manifest. Standalone GraphLaw must pin
# the actually-resolved CalVer releases rather than silently depend on Praxis topology.
wasm4pm-compat = { version = "=26.8.7" }
wasm4pm-cognition = { git = "https://github.com/seanchatmangpt/wasm4pm", rev = "b7ebccb53b1249d45d2472f7754c997982b2f1b7", package = "wasm4pm-cognition", optional = true }

[features]
cognition = ["dep:wasm4pm-cognition"]

[lib]
name = "praxis_graphlaw"

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "hierarchies"
harness = false

[[bench]]
name = "dialects"
harness = false

[[bench]]
name = "blue_river_dam"
harness = false

[[bench]]
name = "owlrl"
harness = false

[[bench]]
name = "daily_standing"
harness = false

[[bench]]
name = "business_logic_replacement"
harness = false

[dev-dependencies]
divan = "0.1"
# Seeded fake-data generation for test fixtures only (anti-hardcoding proof in
# chatman_pddl_to_powl_projection); never a production dependency.
fake = "4"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.5"
# Required for chicago_tdd_tools::async_test! (expands to #[tokio::test]).\n# 26.8.9 is the first admitted test-harness release used by the extracted tree that\n# provides every requested feature below, including cli-proof.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# otel/weaver features left OFF: they drag network deps into the required build.
chicago-tdd-tools = { version = "=26.8.9", features = [
    "property-testing",
    "snapshot-testing",
    "parameterized-testing",
    "mutation-testing",
    "concurrency-testing",
    "cli-proof",
    "receipt-validation",
    "ocel-generation",
] }


[workspace]
resolver = "2"
members = [
    ".",
    "crates/praxis-graphlaw-wasm",
    "crates/powl2-decompose",
]
