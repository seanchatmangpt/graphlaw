[package]
name = "graphlaw-wasm"
# Digest pin minted with version 26.10.22:
# f149433c6e1a84ec95e961ac92b16b65b28e15d6fd8546beb1779d3b54a02e7e (7,104,147 B, tag section count 0).
# Re-pin registry/ARTIFACTS.blake3 and priv/graphlaw.wasm.blake3 from a real
# `cargo build --locked -p graphlaw-wasm --target wasm32-wasip1 --profile wasm`
# in the same commit as any further version bump. Do not fabricate a digest.
version = "26.10.22"
edition = "2024"
rust-version = "1.96"
license = "MIT AND LicenseRef-P28-SIL-2.1.0"
description = "GraphLaw as a WebAssembly module: a JSON-over-linear-memory ABI for hosts such as Elixir (Wasmex)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
graphlaw = { path = "..", features = ["abi", "wasi-patched-deps"] }

# Size-optimised profile for the WebAssembly module (`--profile wasm`); kept
# separate so native release builds and tests are unaffected.
# Rendered from the rust-wasi-wasmex-pack via ontologies/graphlaw-wasm.ttl
# (`ggen sync run`, rules wasm-abi-meta / wasm-ffi).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
