[package]
name = "graphlaw-wasm"
version = "26.9.29"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "GraphLaw as a WebAssembly module: a JSON-over-linear-memory ABI for hosts such as Elixir (Wasmex)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
graphlaw = { path = "..", features = ["abi", "wasi-patched-deps"] }
