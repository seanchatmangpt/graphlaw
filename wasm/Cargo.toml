[package]
name = "graphlaw-wasm"
# The digest pins in registry/ARTIFACTS.blake3 (332ea218…, 6,793,617 B) were minted
# at the 26.10.21 source state; they remain valid only until the next artifact
# rebuild. At that rebuild the coordinator MUST re-pin both registry/ARTIFACTS.blake3
# and priv/graphlaw.wasm.blake3 in the same commit as any further version bump.
# Do NOT fabricate a new digest without a real rebuild.
version = "26.10.21"
edition = "2024"
rust-version = "1.96"
license = "MIT AND LicenseRef-P28-SIL-2.1.0"
description = "GraphLaw as a WebAssembly module: a JSON-over-linear-memory ABI for hosts such as Elixir (Wasmex)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
graphlaw = { path = "..", features = ["abi", "wasi-patched-deps"] }

# Size-optimised profile for the WebAssembly module (`--profile wasm`); kept
# separate so native release builds and tests are unaffected.
# Rendered from the rust-wasi-wasmex-pack via ontologies/graphlaw-wasm.ttl
# (`ggen sync run`, rules wasm-abi-meta / wasm-ffi).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
