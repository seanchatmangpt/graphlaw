[package]
name = "graphlaw-wasm"
version = "26.10.5"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "GraphLaw as a WebAssembly module: a JSON-over-linear-memory ABI for hosts such as Elixir (Wasmex)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
graphlaw = { path = "..", features = ["abi", "wasi-patched-deps"] }

# Size-optimised profile for the WebAssembly module (`--profile wasm`); kept
# separate so native release builds and tests are unaffected.
# Rendered from ggen wasi-json-abi-pack generated/graphlaw/cargo-profile.toml.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
