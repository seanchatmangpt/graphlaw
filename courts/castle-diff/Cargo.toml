# L41 castle hash-unification court (formerly tests/castle_hash_unification.rs).
#
# Why a separate, workspace-EXCLUDED crate: the court needs ggen-engine at the
# castle-pinned rev, whose transitive wasm4pm-compat 26.8.7 uses
# `#![feature(generic_const_exprs)]` (E0554 on the pinned stable 1.96.0
# toolchain). A git dependency in the root manifest (any section) also trips
# tests/authority_manifest.rs::no_git_or_unpublishable_path_dependencies
# (`git = ` manifest-text check). An excluded crate keeps:
#   - plain stable `cargo test` at the root building and green;
#   - the court reachable explicitly: cargo +nightly test (from this dir).
[package]
name = "castle-diff-court"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
graphlaw = { path = "../..", features = ["abi"] }
serde_json = "1"
sha2 = "0.11"
ggen-engine = { git = "https://github.com/seanchatmangpt/ggen", rev = "162e466d8f07d0a75a468b4441b4bc8b1aad369b", package = "ggen-engine", default-features = false }

# Keeps this court OUT of the parent graphlaw workspace (parent also lists it in workspace.exclude).
[workspace]
