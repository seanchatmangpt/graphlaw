# cargo-deny policy for graphlaw. Run: `cargo deny check advisories licenses bans sources`.
# The license allow-list was computed from `cargo deny list` over the real
# dependency tree; LGPL-2.1-or-later appears only as one alternative of the
# `MIT OR Apache-2.0 OR LGPL-2.1-or-later` expression on r-efi, and is NOT allowed.

[graph]
all-features = true

[advisories]
ignore = [
    # RUSTSEC-2026-0258 h2 0.3.27 (unbounded empty DATA frames, DoS):
    # transitive via frozen-duckdb -> reqwest ^0.11; h2 0.4 is
    # semver-incompatible with that pin. NOT on the in-WASM runtime
    # execution or receipt-signing path (host tooling only).
    # Expiry: 2026-11-23 (30-day window for upstream reconciliation).
    "RUSTSEC-2026-0258",
    # unmaintained warnings (transitive, host tooling only); expiry 2026-11-23
    "RUSTSEC-2025-0134",
    "RUSTSEC-2024-0449",
]

version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # purrdf 3.x family (RUST-8 lane L7: keep a purrdf 3.x migration unblocked).
    # NOTE: the workspace crates' own "MIT AND LicenseRef-P28-SIL-2.1.0"
    # expression cannot be allow-listed here — cargo-deny's SPDX parser
    # rejects LicenseRef-* identifiers outright (parse error at allow-list
    # parse time, before any check runs).
    "MulanPSL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
