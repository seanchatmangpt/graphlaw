# cargo-deny policy for graphlaw. Run: `cargo deny check advisories licenses bans sources`.
# The license allow-list was computed from `cargo deny list` over the real
# dependency tree; LGPL-2.1-or-later appears only as one alternative of the
# `MIT OR Apache-2.0 OR LGPL-2.1-or-later` expression on r-efi, and is NOT allowed.

[graph]
all-features = true

[advisories]
ignore = [
    # RUSTSEC-2026-0258 h2 0.3.27 (unbounded empty DATA frames, DoS):
    # transitive via frozen-duckdb -> reqwest ^0.11; h2 0.4 is
    # semver-incompatible with that pin. NOT on the in-WASM runtime
    # execution or receipt-signing path (host tooling only).
    # Expiry: 2026-11-23 (30-day window for upstream reconciliation).
    "RUSTSEC-2026-0258",
    # unmaintained warnings (transitive, host tooling only); expiry 2026-11-23
    "RUSTSEC-2025-0134",
    "RUSTSEC-2024-0449",
]

version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # purrdf 3.x family (RUST-8 lane L7: keep a purrdf 3.x migration unblocked).
    # NOTE: the workspace crate (graphlaw) is "MIT" (LICENSE.md), so no
    # [[licenses.clarify]] stanza is needed for it; the purrdf family,
    # git-sourced from https://github.com/seanchatmangpt/purrdf (rev-pinned),
    # carries its own "MIT OR Apache-2.0 OR MulanPSL-2.0" expression — the
    # MulanPSL-2.0 allow entry below exists for exactly that expression.
    "MulanPSL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# "warn" (2026-10-29, receipted): the only wildcards in the tree are the two
# git deps at Cargo.toml:50-51 -- purrdf/purrdf-columnar, each pinned to an
# exact rev (2223f894...). An exact-rev pin is strictly stronger identity than
# a version requirement; the wildcard gate's real target (floating "*" reqs)
# stays covered here and by the [sources] gate. Witnessed: deny log names
# exactly those two crates (tag run 40797877854).
wildcards = "warn"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The pinned purrdf fork is the one lawful git source: the WASI clock gate and
# the P01 proof-checker hardening live at its rev (see [dependencies] in
# Cargo.toml and tests/wasi_patch_guard.rs).
allow-git = ["https://github.com/seanchatmangpt/purrdf"]
